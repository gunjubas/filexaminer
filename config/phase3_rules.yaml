classes:
  - ephemeral / regenerable
  - derived but costly
  - user content
  - identity / trust
  - unknown / mixed

defaults:
  unknown_class: unknown / mixed
  directory_min_score: 6
  file_min_score: 5
  medium_confidence_margin: 2
  high_confidence_score: 10
  high_confidence_margin: 4

# Human-readable term catalogs.
directory_term_catalog:
  ephemeral_runtime:
    - .cache
    - cache
    - tmp
    - temp
    - node_modules
    - __pycache__
    - .npm
    - .cargo/registry
  ephemeral_dot_state:
    - .thumbnails
    - .cache
    - .npm
    - .yarn
    - .pytest_cache
  derived_build_runtime:
    - target
    - build
    - dist
    - .gradle
    - .m2
    - .venv
    - venv
    - .terraform
    - .rustup
  derived_large_system:
    - library
    - application support
    - containers
    - docker
    - virtualbox
    - vm
    - cache
  user_content_primary:
    - documents
    - desktop
    - downloads
    - pictures
    - photos
    - videos
    - music
    - projects
    - notes
    - workspace
    - archive
  user_content_creative:
    - writing
    - manuscripts
    - journals
    - design
    - assets
    - media
  identity_credentials:
    - .ssh
    - .gnupg
    - .pki
    - .password-store
    - .aws
    - .kube
    - keychain
    - cert
    - certs
    - secrets
  identity_browser_profiles:
    - .mozilla
    - .config/google-chrome
    - .config/chromium
    - .config/bravesoftware

file_path_term_catalog:
  user_content_locations:
    - documents
    - desktop
    - downloads
    - pictures
    - photos
    - videos
    - music
    - notes
    - projects
    - workspace
  ephemeral_runtime:
    - tmp
    - temp
    - .cache
    - __pycache__
    - node_modules
  derived_build_runtime:
    - target
    - build
    - dist
    - .venv
    - venv
    - .gradle
    - .m2

file_name_term_catalog:
  identity_key_names:
    - id_rsa
    - id_ed25519
    - known_hosts
    - authorized_keys

file_suffix_catalog:
  identity_key_suffixes:
    - .pem
    - .key
    - .crt
    - .p12
    - .kdbx

directory_rules:
  - id: dir_ephemeral_cache
    class: ephemeral / regenerable
    weight: 7
    path_template_refs:
      - ephemeral_runtime
    reason: Path terms match common regenerable cache or temporary directory patterns.

  - id: dir_ephemeral_dot_state
    class: ephemeral / regenerable
    weight: 4
    path_template_refs:
      - ephemeral_dot_state
    requires_dot_directory: 1
    reason: Hidden state/cache directory terms suggest regenerable artifacts.

  - id: dir_derived_dev_build
    class: derived but costly
    weight: 7
    path_template_refs:
      - derived_build_runtime
    reason: Path terms match derived build/runtime artifacts that may be expensive to recreate.

  - id: dir_derived_large_lowdiv
    class: derived but costly
    weight: 4
    path_template_refs:
      - derived_large_system
    max_mime_diversity: 3
    min_file_count: 20
    reason: Large low-diversity technical data directories often contain costly derived state.

  - id: dir_user_content_primary
    class: user content
    weight: 8
    path_template_refs:
      - user_content_primary
    reason: Path terms match common personal content and authored data locations.

  - id: dir_user_content_creative
    class: user content
    weight: 5
    path_template_refs:
      - user_content_creative
    reason: Path terms indicate authored or curated creative content.

  - id: dir_identity_credentials
    class: identity / trust
    weight: 9
    path_template_refs:
      - identity_credentials
    reason: Path terms match credential, key, certificate, or trust-anchor directories.

  - id: dir_identity_browser_profile
    class: identity / trust
    weight: 6
    path_template_refs:
      - identity_browser_profiles
    reason: Browser profile directories encode identity/session/trust state.

file_rules:
  - id: file_user_content_docs_media
    class: user content
    weight: 6
    path_template_refs:
      - user_content_locations
    mime_prefixes:
      - text/
      - image/
      - video/
      - audio/
    mime_equals:
      - application/pdf
    reason: MIME family and path terms indicate authored or curated user content.

  - id: file_identity_keys
    class: identity / trust
    weight: 8
    filename_template_refs:
      - identity_key_names
    suffix_template_refs:
      - identity_key_suffixes
    reason: Filename terms/suffixes indicate keys, certificates, or security-sensitive identity material.

  - id: file_ephemeral_runtime
    class: ephemeral / regenerable
    weight: 6
    path_template_refs:
      - ephemeral_runtime
    reason: Runtime cache/temp path terms indicate regenerable file state.

  - id: file_derived_artifacts
    class: derived but costly
    weight: 6
    path_template_refs:
      - derived_build_runtime
    reason: Path terms indicate build or environment artifacts likely derived from source.
